# 🚀 MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/thriving/softwood/**/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # 开发环境打印 SQL (生产环境请务必关闭，或使用 p6spy)
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: thriving.softwood.**.database.pojo